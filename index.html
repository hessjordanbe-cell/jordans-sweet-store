<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan's Sweet Shop 🍭</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff7fb;color:#35132f}
header{height:76px;background:white;border-bottom:1px solid #f0dce9;display:flex;align-items:center;justify-content:space-between;padding:0 8%;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}
.logo-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#ff9a62,#ff4f9a);display:grid;place-items:center;font-size:23px}
nav{display:flex;align-items:center;gap:28px;font-weight:700;font-size:14px}
nav a{color:#35132f;text-decoration:none}
.cart{background:#572052;color:white;padding:12px 18px;border-radius:14px}
.cart span{background:#ffb02e;color:#35132f;border-radius:50%;padding:3px 7px;margin-left:6px}
main{max-width:1050px;margin:0 auto;padding:18px 0 60px}
.sort{width:100%;padding:12px;border:1px solid #f1d4e3;border-radius:12px;background:white;font-size:14px}
.categories{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.cat{padding:10px 15px;border:1px solid #f1d4e3;border-radius:13px;background:white;font-weight:800;color:#572052;cursor:pointer}
.cat.active{background:#ffe6f1;border-color:#ffb6d3}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:white;border:1px solid #f0dce9;border-radius:18px;overflow:hidden;box-shadow:0 4px 15px #5b245f10}
.pic{height:145px;background:linear-gradient(135deg,#fff0f8,#f5eaff);display:grid;place-items:center;font-size:68px}
.info{padding:14px}
.badge{display:inline-block;background:#572052;color:white;padding:6px 9px;border-radius:10px;font-size:10px;font-weight:800;margin-bottom:8px}
h2{font-size:16px;margin:4px 0 8px}
.desc{font-size:13px;line-height:1.4;color:#77566f;min-height:38px}
.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.price{font-size:18px;font-weight:900}
button{border:0;background:#ff4f91;color:white;font-weight:800;padding:10px 13px;border-radius:11px;cursor:pointer}
button:hover{filter:brightness(.95)}
footer{text-align:center;padding:30px;color:#806579;font-size:13px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}header{padding:0 4%}main{padding:18px 4%}}
@media(max-width:500px){.grid{grid-template-columns:1fr}nav a:not(.cart){display:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon">🍭</div>Jordan's Sweet Shop</div>
  <nav><a href="#shop">Shop</a><a href="#why">Why us</a><a href="#faq">FAQ</a><a href="#cart" class="cart">🛒 Cart <span id="count">0</span></a></nav>
</header>

<main id="shop">
<select class="sort" id="sort">
  <option>Sort: Featured</option>
  <option>Price: Low to High</option>
  <option>Price: High to Low</option>
  <option>Name: A to Z</option>
</select>

<div class="categories">
  <button class="cat active" data-cat="All">All</button>
  <button class="cat" data-cat="Lollipops">Lollipops</button>
  <button class="cat" data-cat="Chocolate">Chocolate</button>
  <button class="cat" data-cat="Gummies">Gummies</button>
  <button class="cat" data-cat="Sour">Sour</button>
</div>

<div class="grid" id="products"></div>
</main>

<section id="why" style="max-width:1050px;margin:auto;padding:20px 4%;text-align:center">
<h2>Why shop with Jordan's?</h2>
<p>Fun candy, simple prices, and carefully packed orders.</p>
</section>

<section id="faq" style="max-width:1050px;margin:auto;padding:20px 4%;text-align:center">
<h2>FAQ</h2>
<p>More shipping and ordering information will be added before the shop officially launches.</p>
</section>

<footer>Jordan's Sweet Shop 🍬</footer>

<script>
const products=[
 {name:"Assorted Rainbow Swirl Lollipops",price:2.99,cat:"Lollipops",emoji:"🍭",badge:"Popular",desc:"Bright, colorful swirl lollipops in assorted flavors."},
 {name:"Tootsie Roll Midgees",price:4.99,cat:"Chocolate",emoji:"🍫",badge:"",desc:"Classic chewy chocolate-flavored Tootsie Roll candies."},
 {name:"Assorted Gummy Candy Mix",price:3.99,cat:"Gummies",emoji:"🍬",badge:"Best seller",desc:"A mix of chewy gummy favorites in different shapes and flavors."},
 {name:"Sour Punch Assorted Twists",price:4.49,cat:"Sour",emoji:"🍋",badge:"Sour",desc:"Chewy, fruity sour twists in assorted flavors."},
 {name:"Werther's Original Hard Caramels",price:5.49,cat:"Caramel",emoji:"🍮",badge:"",desc:"Classic creamy caramel hard candies."},
 {name:"HARIBO Goldbears Gummy Bears",price:3.49,cat:"Gummies",emoji:"🧸",badge:"",desc:"Classic chewy gummy bears in assorted fruit flavors."},
];

let cart=0, current="All";
const grid=document.getElementById("products"), count=document.getElementById("count");

function render(){
 let list=products.filter(p=>current==="All"||p.cat===current);
 const sort=document.getElementById("sort").value;
 if(sort==="Price: Low to High") list.sort((a,b)=>a.price-b.price);
 if(sort==="Price: High to Low") list.sort((a,b)=>b.price-a.price);
 if(sort==="Name: A to Z") list.sort((a,b)=>a.name.localeCompare(b.name));
 grid.innerHTML=list.map((p,i)=>`
 <article class="card">
   <div class="pic">${p.emoji}</div>
   <div class="info">
    ${p.badge?`<div class="badge">${p.badge}</div>`:""}
    <h2>${p.name}</h2>
    <div class="desc">${p.desc}</div>
    <div class="bottom"><div class="price">$${p.price.toFixed(2)}</div><button onclick="add()">Add to cart</button></div>
   </div>
 </article>`).join("");
}
function add(){cart++;count.textContent=cart}
document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
 b.classList.add("active"); current=b.dataset.cat; render();
});
document.getElementById("sort").onchange=render;
render();
</script>
</body>
</html>
